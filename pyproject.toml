[project]
name = "cadence-preop-triage"
version = "0.1.0"
description = "Deterministic pre-op scheduling triage engine for the Cadence take-home exercise"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "rich==15.0.0",
  "textual==8.2.8",
  "ruff==0.16.1",
]
openai-evals = [
  "openai==2.52.0",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",
  "SIM102",
  "SIM108",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
